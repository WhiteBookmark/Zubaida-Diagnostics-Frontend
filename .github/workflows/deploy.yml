name: Deploy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Build and Deploy
        run: |
          npm install --legacy-peer-deps
          npm run build
          rsync -av --delete dist/ /var/www/zubaida-frontend/
